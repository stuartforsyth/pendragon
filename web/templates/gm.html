<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendragon — GM Console</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="/static/css/gm.css">
  <link rel="stylesheet" href="/static/css/tools.css">
  <link rel="stylesheet" href="/static/css/cardface.css">
</head>
<body>
  <div class="shell" id="shell">
    <header class="topbar">
      <div class="brand" title="Pendragon GM">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <path d="M16 3 6 7v8c0 6.5 4.3 10.8 10 13 5.7-2.2 10-6.5 10-13V7Z"/>
          <path d="M11 13c2-3 4-4 7-3l2-2 1 3c1 1 1 3 0 4l-3 1-2 4-1-3-3 1Z" fill="currentColor" fill-opacity=".25"/>
        </svg>
      </div>
      <span class="rec-dot off" id="recDot" title="Recording"></span>
      <div style="min-width:0">
        <div class="session-title scratch" id="sessionTitle">…</div>
      </div>
      <span class="session-sub" id="sessionSub"></span>
      <div class="spacer"></div>
      <div id="sessionControls" class="row"></div>
      <div class="chips" id="tableMode" title="What the Table screen shows"></div>
      <button class="btn ghost" id="pinnedRules" title="Pinned rules: show one on the Table, or take the shown one off">Rules ▾</button>
      <button class="btn ghost" id="clearTable" title="Clear the Table screen (the log keeps everything)">Clear Table</button>
      <button class="btn" id="openTable" title="Open the Table screen in its own window — share it on Discord">
        <span class="i"></span>Open Table</button>
      <span class="conn" id="conn">live</span>
      <button class="btn ghost icon" id="toggleLog" title="Show / hide the session log"></button>
    </header>
    <nav class="rail" id="rail"></nav>
    <main class="main" id="main"></main>
    <aside class="log" id="log"></aside>
  </div>
  <script type="module" src="/static/js/gm.js"></script>
  <script type="module" src="/static/js/feedback.js"></script>
</body>
</html>
